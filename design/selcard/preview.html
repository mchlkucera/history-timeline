/* ── Review-page scaffolding only. Not part of the component.
      Uses shell tokens exclusively so it cannot flatter the design.
      Each specimen lives in its own document (an iframe) so that BOTH themes
      are live on one page through the real three-state :root theming, with no
      duplicated palette anywhere. ── */
html, body { margin: 0; }
body {
  background: var(--tl-ground);
  color: var(--tl-ink);
  font-family: var(--tl-font-ui);
  font-size: var(--tl-text-base);

}
.sheetonly { background: var(--tl-ground); }
.wrap { padding: var(--tl-space-8) var(--tl-space-9) var(--tl-space-12); max-width: 1408px; margin: 0 auto; }

.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--tl-space-6);
      padding-bottom: var(--tl-space-5); border-bottom: 1px solid var(--tl-rule); }
.hd__mark { font-family: var(--tl-font-mark); font-size: var(--tl-text-md); color: var(--tl-ink); }
.hd h1 { margin: 2px 0 0; font-size: var(--tl-text-xl); font-weight: 600; letter-spacing: var(--tl-track-tight); }
.hd p { margin: var(--tl-space-3) 0 0; font-size: var(--tl-text-sm); color: var(--tl-ink-2); max-width: 64ch; }
.hd__btn { flex: none; height: var(--tl-ctl); padding: 0 var(--tl-space-5); border: 1px solid var(--tl-rule);
  border-radius: var(--tl-radius-sm); background: var(--tl-surface); color: var(--tl-ink);
  font: inherit; font-size: var(--tl-text-sm); cursor: pointer; }
.hd__btn:hover { background: var(--tl-surface-3); }

.legend { display: flex; flex-wrap: wrap; gap: var(--tl-space-4) var(--tl-space-8); margin-top: var(--tl-space-6);
  font-size: var(--tl-text-xs); color: var(--tl-ink-3); }
.legend b { color: var(--tl-ink-2); font-weight: 500; }

.row { display: grid; grid-template-columns: minmax(240px, 1fr) 360px 360px; gap: var(--tl-space-8);
  align-items: start; padding: var(--tl-space-9) 0; border-bottom: 1px solid var(--tl-rule-soft); }
.row--sheet { grid-template-columns: minmax(240px, 1fr) 390px 390px; }
@media (max-width: 1180px) { .row, .row--sheet { grid-template-columns: 1fr; } }

.spec__id { font-family: var(--tl-font-mono); font-size: var(--tl-text-2xs); letter-spacing: var(--tl-track-caps);
  text-transform: uppercase; color: var(--tl-ink-3); }
.spec h2 { margin: var(--tl-space-2) 0 0; font-size: var(--tl-text-lg); font-weight: 600;
  letter-spacing: var(--tl-track-tight); }
.spec__ctx { margin-top: var(--tl-space-4); font-family: var(--tl-font-mono); font-size: var(--tl-text-2xs);
  font-variant-numeric: tabular-nums; color: var(--tl-ink-3); line-height: 1.7; }
.spec__ctx span { display: block; }
.spec__ctx em { font-style: normal; color: var(--tl-ink-2); }
.spec p { margin: var(--tl-space-5) 0 0; font-size: var(--tl-text-sm); color: var(--tl-ink-2); max-width: 54ch; }
.spec p b { color: var(--tl-ink); font-weight: 600; }

.pane { display: flex; flex-direction: column; gap: var(--tl-space-3); }
.pane__t { font-family: var(--tl-font-mono); font-size: var(--tl-text-2xs); letter-spacing: var(--tl-track-caps);
  text-transform: uppercase; color: var(--tl-ink-3); }
.pane__win { width: 360px; overflow: hidden; border: 1px solid var(--tl-rule);
  border-radius: var(--tl-radius-md); background: var(--tl-canvas-bg); }
.pane__win--sheet { width: 390px; height: 844px; }
iframe { border: 0; display: block; background: var(--tl-canvas-bg); color-scheme: normal; }

<script>
/* =============================================================================
   REAL CONTENT ONLY. Every name, date, note, category, relation and weight
   below is read out of the app's own corpus:
     web/public/data/datasets.json   POLIS, LIVES, CATMAP, PLACEMAP
     web/public/data/relations.json  spreads + weighted links
     web/public/data/polities.json   the snapshot -> sovereign alias table
     web/public/data/lanes.json      the Arts lane
   Nothing here is invented, including the relation weights and the snapshot
   years (the corpus has eighteen: -3000 … 1783, 1815, 1880, 1914, 1938, 1994).
   ============================================================================= */

var CARD_CSS = '<link rel="preconnect" href="https://fonts.googleapis.com">'
  + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
  + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">'
  + '<link rel="stylesheet" href="../tokens.css">'
  + '<link rel="stylesheet" href="selcard.css">';

/* The card floats over a live canvas, so the specimen ground is the canvas
   ground plus the shell's own CSS graticule — that is the only way to judge
   the translucent surface and the shadow honestly. */
var FRAME_CSS = ''
  + 'html,body{margin:0}'
  + 'body{background:var(--tl-canvas-bg);font-family:var(--tl-font-ui);'
  + 'background-image:repeating-linear-gradient(to right,var(--tl-graticule) 0 1px,transparent 1px 32px),'
  + 'repeating-linear-gradient(to bottom,var(--tl-graticule) 0 1px,transparent 1px 32px);}'
  + '.stage{padding:14px;display:flex;align-items:flex-start;justify-content:flex-start;min-height:100%;box-sizing:border-box}'
  + '.phone{min-height:100vh;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;padding:0}'
  + '.phone .tl-selcard{width:100%}'
  + '.rail{height:56px;flex:none;border-top:1px solid var(--tl-rule);background:var(--tl-surface);'
  + 'display:flex;align-items:center;padding:0 12px;gap:10px;font-family:var(--tl-font-mono);'
  + 'font-size:11px;color:var(--tl-ink-2);font-variant-numeric:tabular-nums}'
  + '.rail .sc{flex:1 1 auto;height:14px;position:relative;border-bottom:1px solid var(--tl-rule);'
  + 'background-image:repeating-linear-gradient(to right,var(--tl-tick) 0 1px,transparent 1px 10%);'
  + 'background-size:100% 5px;background-position:0 100%;background-repeat:no-repeat}'
  + '.rail .sc::after{content:"";position:absolute;left:30%;top:0;bottom:-1px;width:1px;background:var(--tl-accent)}';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ── the card template — this is the markup contract the integration must emit ── */
function destBtn(d) {
  var cls = 'tl-selcard__dest' + (d.primary ? ' tl-selcard__dest--primary' : '');
  var a = ['class="' + cls + '"', 'type="button"', 'title="' + esc(d.title) + '"'];
  if (d.current) a.push('aria-current="true"');
  if (d.off) a.push('aria-disabled="true"');
  return '<button ' + a.join(' ') + '>' + esc(d.label)
    + (d.primary ? '<kbd class="tl-selcard__cap">↵</kbd>' : '')
    + (d.off ? '<span class="tl-selcard__sr">unavailable — ' + esc(d.title) + '</span>' : '')
    + '</button>';
}

function relsBlock(s) {
  if (!s.rels || !s.rels.length) {
    return '<div class="tl-selcard__rels" data-empty="true">'
      + '<div class="tl-selcard__relshd">'
      + '<span class="tl-selcard__section">Connections</span>'
      + '<span class="tl-selcard__none">None curated yet.</span>'
      + '</div></div>';
  }
  var rows = s.rels.slice(0, 4).map(function (r) {
    return '<li><button type="button" class="tl-selcard__rel" data-goid="' + esc(r.id) + '">'
      + '<span class="tl-selcard__rel-n">' + esc(r.name) + '</span>'
      + '<span class="tl-selcard__rel-k">' + esc(r.kind) + '</span>'
      + '<span class="tl-selcard__bar" style="--sc-w:' + Math.round(r.w * 100) + '%" aria-hidden="true"><i></i></span>'
      + '<span class="tl-selcard__sr">strength ' + r.w.toFixed(2) + '</span>'
      + '</button></li>';
  }).join('');
  return '<div class="tl-selcard__rels">'
    + '<div class="tl-selcard__relshd">'
    + '<span class="tl-selcard__section">Connections</span>'
    + '<button type="button" class="tl-selcard__all">All ' + s.total + ' →</button>'
    + '</div><ul class="tl-selcard__rellist">' + rows + '</ul></div>';
}

function card(s) {
  return '<div class="tl-selcard tl-selcard--flow" data-side="r" role="dialog" aria-label="' + esc(s.name) + '">'
    + '<div class="tl-selcard__grip" aria-hidden="true"></div>'
    + '<div class="tl-selcard__head">'
    +   '<div class="tl-selcard__top">'
    +     '<div class="tl-selcard__meta" style="--tl-dot: var(--tl-cat-' + s.cat + ')">'
    +       '<span class="tl-selcard__dot" aria-hidden="true"></span>'
    +       '<span><b>' + esc(s.domain) + '</b> · ' + esc(s.type)
    +       (s.band ? ' · ' + esc(s.band) : '') + '</span>'
    +     '</div>'
    +     '<button type="button" class="tl-selcard__x" aria-label="Close" title="Close &nbsp;Esc">'
    +       '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
    +       '<path d="M4 4l8 8M12 4l-8 8"/></svg></button>'
    +   '</div>'
    +   '<h3 class="tl-selcard__name">' + esc(s.name) + '</h3>'
    +   '<div class="tl-selcard__span" data-kind="' + (s.kind || 'span') + '"'
    +     ' style="--sc-a:' + s.a + '%;--sc-b:' + s.b + '%;--sc-i:' + s.i + '%">'
    +     '<div class="tl-selcard__track" aria-hidden="true">'
    +       '<span class="tl-selcard__life"></span><span class="tl-selcard__idx"></span></div>'
    +     '<div class="tl-selcard__ends"><b>' + esc(s.dates) + '</b><span>' + esc(s.year) + '</span></div>'
    +     (s.present ? '<div class="tl-selcard__present">' + esc(s.present) + '</div>' : '')
    +   '</div>'
    +   (s.note ? '<p class="tl-selcard__note">' + esc(s.note) + '</p>' : '')
    +   (s.folds && s.folds.length
          ? '<div class="tl-selcard__folds">' + s.folds.map(function (f) {
              return '<div class="tl-selcard__fold"><b>' + esc(f.role) + '</b> — ' + esc(f.title)
                + ', <time>' + esc(f.year) + '</time></div>'; }).join('') + '</div>'
          : '')
    + '</div>'
    + '<div class="tl-selcard__go">'
    +   '<span class="tl-selcard__lead" id="showin">Show this in</span>'
    +   '<div class="tl-selcard__dests" role="group" aria-labelledby="showin">'
    +     s.dests.map(destBtn).join('') + '</div>'
    + '</div>'
    + relsBlock(s)
    + '</div>';
}

/* ── build ──────────────────────────────────────────────────────────────────── */
function frame(theme, html, phone) {
  return '<!doctype html><html lang="en" data-theme="' + theme + '"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + CARD_CSS + '<style>' + FRAME_CSS + '</style></head><body>'
    + '<div class="stage' + (phone ? ' phone' : '') + '">' + html
    + (phone ? '<div class="rail"><span>1783</span><span class="sc"></span><span>▶</span></div>' : '')
    + '</div></body></html>';
}

/* A desktop specimen must have a viewport WIDER than 759px, or the card's own
   narrow media query turns it into a bottom sheet — and a viewport with a real
   height, or min(58vh, 480px) resolves against a frame that is itself being
   sized from the card. So the frame is a genuine 820 x 900 app viewport and the
   review page just clips a 360px window onto it. */
function pane(theme, html, phone) {
  var f = document.createElement('iframe');
  f.setAttribute('title', theme + ' theme specimen');
  f.setAttribute('scrolling', 'no');
  f.style.width  = (phone ? 390 : 820) + 'px';
  f.style.height = (phone ? 844 : 900) + 'px';
  f.srcdoc = frame(theme, html, phone);
  var win = document.createElement('div');
  win.className = 'pane__win' + (phone ? ' pane__win--sheet' : '');
  win.appendChild(f);
  if (!phone) {
    win.style.height = '480px';
    f.addEventListener('load', function () {
      try {
        var c = f.contentDocument.querySelector('.tl-selcard');
        win.style.height = (Math.ceil(c.getBoundingClientRect().height) + 28) + 'px';
      } catch (e) {}
    });
  }
  var box = document.createElement('div');
  box.className = 'pane';
  box.innerHTML = '<div class="pane__t">' + theme + '</div>';
  box.appendChild(win);
  return box;
}

function specimen(st, phone) {
  var row = document.createElement('div');
  row.className = 'row' + (phone ? ' row--sheet' : '');
  row.id = 'state-' + st.id;
  var col = document.createElement('div');
  col.className = 'spec';
  col.innerHTML = '<div class="spec__id">' + st.tag + '</div><h2>' + st.h + '</h2>'
    + '<div class="spec__ctx"><span>' + st.ctx.join('</span><span>') + '</span></div>'
    + '<p>' + st.why + '</p>';
  row.appendChild(col);
  var html = card(st.s);
  row.appendChild(pane('light', html, phone));
  row.appendChild(pane('dark',  html, phone));
  return row;
}

(function () {
  var q = new URLSearchParams(location.search);
  var root = document.documentElement;
  var t = q.get('theme');
  if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);

  var wrap = document.getElementById('wrap');

  /* ?only=sheet-light | sheet-dark — a single specimen, no page chrome, so the
     sheet can be screenshotted at an honest 390 x 844. */
  var only = q.get('only');
  if (only === 'sheet-light' || only === 'sheet-dark') {
    document.body.className = 'sheetonly';
    wrap.style.padding = '0';
    var f = document.createElement('iframe');
    f.style.cssText = 'width:390px;height:844px;border:0;border-radius:0';
    f.srcdoc = frame(only === 'sheet-dark' ? 'dark' : 'light', card(SHEET.s), true);
    wrap.appendChild(f);
    return;
  }

  var hd = document.createElement('div');
  hd.className = 'hd';
  hd.innerHTML =
    '<div><div class="hd__mark">Timeline</div><h1>The selection card</h1>'
    + '<p>Eight states, both themes, real corpus content. Each specimen is a separate document stamped '
    + '<code>data-theme</code>, so light and dark are both genuinely live through <code>tokens.css</code> '
    + '— no palette is duplicated anywhere on this page. The ground behind each card is the canvas '
    + 'colour plus the shell graticule, because the card is translucent and can only be judged over one.</p></div>'
    + '<button class="hd__btn" id="themeBtn" type="button">Flip page chrome</button>';
  wrap.appendChild(hd);

  var lg = document.createElement('div');
  lg.className = 'legend';
  lg.innerHTML = '<span><b>Accent budget</b> — the span index and the focus ring. Nothing else.</span>'
    + '<span><b>Data hue</b> — one, quoted by the domain dot.</span>'
    + '<span><b>Order</b> — Timeline, Map, Cube, Core. Never reordered.</span>'
    + '<span><b>Hide</b> = never applies. <b>Grey</b> = not at this year.</span>';
  wrap.appendChild(lg);

  STATES.forEach(function (st) { wrap.appendChild(specimen(st, false)); });
  wrap.appendChild(specimen(SHEET, true));

  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme');
    if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
