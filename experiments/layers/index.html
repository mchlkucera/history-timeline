<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Layers concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
/* ── tokens (trimmed from design/tokens.css) ─────────────────────────────── */
:root{
  color-scheme:light;
  --tl-ground:#E3E8E6; --tl-canvas-bg:#E7ECEA; --tl-surface:#F5F7F6; --tl-surface-2:#EDF0EF;
  --tl-surface-3:#E4E9E7; --tl-surface-over:rgba(245,247,246,.94);
  --tl-hover:rgba(18,24,26,.045); --tl-press:rgba(18,24,26,.085); --tl-selected:rgba(18,24,26,.07);
  --tl-ink:#12181A; --tl-ink-2:#505E63; --tl-ink-3:#6D7B7F; --tl-ink-on-accent:#fff;
  --tl-rule:#C7D0CD; --tl-rule-soft:#D6DEDB; --tl-rule-strong:#ADB9B6;
  --tl-graticule:rgba(18,24,26,.055); --tl-tick:rgba(18,24,26,.30); --tl-tick-major:rgba(18,24,26,.55);
  --tl-accent:#B4382A; --tl-accent-hover:#8E2C21; --tl-accent-soft:rgba(180,56,42,.12); --tl-accent-line:rgba(180,56,42,.45);
  --tl-cat-power:#2C4E8F; --tl-cat-war:#8B4A31; --tl-cat-belief:#6B3F79; --tl-cat-sci:#1F6E63;
  --tl-cat-art:#A33A63; --tl-cat-nature:#4F6B2B; --tl-cat-society:#8A6B15; --tl-cat-reach:#16657E;
  --tl-shadow-pop:0 8px 24px rgba(18,24,26,.16),0 1px 2px rgba(18,24,26,.10);
  --tl-shadow-drag:0 10px 26px rgba(18,24,26,.22);
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --tl-ground:#14191B; --tl-canvas-bg:#171D1F; --tl-surface:#1B2225; --tl-surface-2:#20282B;
  --tl-surface-3:#262F33; --tl-surface-over:rgba(27,34,37,.94);
  --tl-hover:rgba(233,240,238,.055); --tl-press:rgba(233,240,238,.10); --tl-selected:rgba(233,240,238,.08);
  --tl-ink:#E9F0EE; --tl-ink-2:#A9B7B9; --tl-ink-3:#7E8D90;
  --tl-rule:#2E393C; --tl-rule-soft:#283134; --tl-rule-strong:#41504F;
  --tl-graticule:rgba(233,240,238,.06); --tl-tick:rgba(233,240,238,.28); --tl-tick-major:rgba(233,240,238,.5);
  --tl-accent:#E06B58; --tl-accent-hover:#F08974; --tl-accent-soft:rgba(224,107,88,.16); --tl-accent-line:rgba(224,107,88,.5);
  --tl-cat-power:#7098DC; --tl-cat-war:#C98058; --tl-cat-belief:#B287C0; --tl-cat-sci:#45B39D;
  --tl-cat-art:#E0789F; --tl-cat-nature:#92B85C; --tl-cat-society:#D2A63C; --tl-cat-reach:#4FAFC9;
  --tl-shadow-pop:0 8px 24px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --tl-shadow-drag:0 10px 26px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--tl-ground);color:var(--tl-ink);
  font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:288px 1fr;height:100vh}

/* ── PANEL ───────────────────────────────────────────────────────────────── */
#panel{background:var(--tl-surface);border-right:1px solid var(--tl-rule);
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:5}
.phead{padding:11px 12px 9px;border-bottom:1px solid var(--tl-rule-soft);display:flex;align-items:baseline;gap:7px}
.phead h1{font-size:12px;font-weight:600;letter-spacing:.02em}
.phead .sub{font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);letter-spacing:.04em;text-transform:uppercase}
#tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:5px 0 10px;scrollbar-width:thin}
.pfoot{border-top:1px solid var(--tl-rule-soft);padding:7px 8px;display:flex;gap:6px}
.btn{font:inherit;font-size:11.5px;color:var(--tl-ink-2);background:transparent;border:1px solid var(--tl-rule);
  border-radius:5px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn:hover{background:var(--tl-hover);color:var(--tl-ink);border-color:var(--tl-rule-strong)}
.btn.pri{border-color:var(--tl-rule-strong)}

.group{margin:1px 0 3px}
.ghead{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 5px;cursor:default;position:relative}
.ghead:hover{background:var(--tl-hover)}
.ghead .chev{width:13px;height:13px;flex:none;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;transition:transform .13s}
.ghead.col .chev{transform:rotate(-90deg)}
.gname{font-size:11px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--tl-ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;cursor:grab}
.ghead .gcount{font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);opacity:.85}
.kids{margin-left:12px;border-left:1px solid var(--tl-rule-soft);padding-left:1px;position:relative}
.kids.empty{min-height:9px}

.row{display:flex;align-items:center;gap:6px;height:25px;padding:0 6px 0 4px;position:relative;cursor:default}
.row:hover{background:var(--tl-hover)}
.row.sel{background:var(--tl-selected);box-shadow:inset 2px 0 0 var(--tl-accent)}
.row.off .nm,.row.off .dot,.ghead.off .gname{opacity:.34}
.row.ghosted{opacity:.30}
.row.drop-src{opacity:.42;background:var(--tl-accent-soft);box-shadow:inset 0 0 0 1px var(--tl-accent-line);border-radius:3px}
.ghead.drop-src{opacity:.55;background:var(--tl-accent-soft)}
.eye{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;border-radius:3px}
.eye:hover{background:var(--tl-press);color:var(--tl-ink)}
.eye svg{width:12px;height:12px;display:block}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.nm{flex:1;font-size:12.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;letter-spacing:-.005em}
.nm b{font-weight:500}
.cnt{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3);opacity:0;flex:none}
.row:hover .cnt{opacity:.7}

/* detail stepper */
.det{display:flex;align-items:flex-end;gap:1.5px;height:12px;flex:none;cursor:pointer;padding:0 1px}
.det i{width:2.5px;background:var(--tl-rule-strong);border-radius:.5px;display:block;transition:background .1s,height .1s}
.det i:nth-child(1){height:4px}.det i:nth-child(2){height:6px}.det i:nth-child(3){height:8px}
.det i:nth-child(4){height:10px}.det i:nth-child(5){height:12px}
.det i.on{background:var(--tl-ink-2)}
.det:hover i.on{background:var(--tl-accent)}
.row.off .det i.on{background:var(--tl-rule-strong)}
.act{display:flex;gap:1px;flex:none;opacity:0;transition:opacity .1s}
.row:hover .act,.ghead:hover .act{opacity:1}
.ic{width:16px;height:16px;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;border-radius:3px;font-size:12px;line-height:1}
.ic:hover{background:var(--tl-press);color:var(--tl-ink)}
.ic.del:hover{color:var(--tl-accent)}
.grip{width:11px;height:16px;flex:none;display:grid;place-items:center;color:var(--tl-rule-strong);cursor:grab;opacity:0}
.row:hover .grip,.ghead:hover .grip{opacity:1}
.grip svg{width:9px;height:11px}

#dropline{position:fixed;height:2px;background:var(--tl-accent);border-radius:2px;pointer-events:none;
  z-index:900;display:none;box-shadow:0 0 0 1px var(--tl-surface)}
#ghost{position:fixed;pointer-events:none;z-index:901;display:none;background:var(--tl-surface);
  border:1px solid var(--tl-rule-strong);border-radius:5px;box-shadow:var(--tl-shadow-drag);
  padding:4px 9px;font-size:12.5px;display:none;align-items:center;gap:6px;opacity:.97}

/* ── popovers ────────────────────────────────────────────────────────────── */
.pop{position:fixed;z-index:950;background:var(--tl-surface-over);backdrop-filter:blur(10px);
  border:1px solid var(--tl-rule);border-radius:8px;box-shadow:var(--tl-shadow-pop);padding:9px;display:none;min-width:206px}
.pop h4{font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;
  color:var(--tl-ink-3);margin-bottom:7px}
.sw{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.sw b{width:15px;height:15px;border-radius:50%;cursor:pointer;display:block;box-shadow:0 0 0 1px var(--tl-rule)}
.sw b.on{box-shadow:0 0 0 2px var(--tl-surface),0 0 0 3.5px var(--tl-ink-2)}
.pop label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--tl-ink-2);margin-bottom:6px}
.pop input[type=range]{width:104px;accent-color:var(--tl-accent)}
.pop .sep{height:1px;background:var(--tl-rule-soft);margin:7px -9px}
.pop .item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.5px}
.pop .item:hover{background:var(--tl-hover)}
.pop .item .n{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3);margin-left:auto}
#libpop{max-height:60vh;overflow:auto;min-width:236px}
#libpop .empty{font-size:11.5px;color:var(--tl-ink-3);padding:6px}
.dang{color:var(--tl-accent)}

/* ── WORKSPACE ───────────────────────────────────────────────────────────── */
#stage{position:relative;overflow:hidden;background:var(--tl-canvas-bg);cursor:grab}
#stage.pan{cursor:grabbing}
#axis{position:absolute;inset:0 0 auto 0;height:24px;background:var(--tl-surface);
  border-bottom:1px solid var(--tl-rule);z-index:3;overflow:hidden}
#axis .t{position:absolute;top:0;height:24px;font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);
  padding-left:4px;line-height:24px;border-left:1px solid var(--tl-rule-soft);white-space:nowrap}
#grid{position:absolute;inset:24px 0 0 0;pointer-events:none;z-index:0;overflow:hidden}
#grid .g{position:absolute;top:0;bottom:0;width:1px;background:var(--tl-graticule)}
#scroll{position:absolute;inset:24px 0 0 0;overflow-y:auto;overflow-x:hidden;z-index:1}
#lanes{position:relative}
.glab{position:absolute;left:0;right:0;height:19px;display:flex;align-items:center;gap:7px;padding-left:10px;
  transition:transform .16s cubic-bezier(.3,.8,.4,1),opacity .16s;will-change:transform}
.glab s{flex:1;height:1px;background:var(--tl-rule);text-decoration:none;display:block;margin-right:10px}
.glab span{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--tl-ink-3)}
.lane{position:absolute;left:0;right:0;height:30px;
  transition:transform .16s cubic-bezier(.3,.8,.4,1),opacity .16s,height .16s;will-change:transform}
.lane.merged{height:36px}
.lane.merged .lbg{background:var(--tl-hover);border-top:1px solid var(--tl-rule-soft);border-bottom:1px solid var(--tl-rule-soft)}
.lane.merged .marks::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--tl-rule-strong);opacity:.5}
.lane .lbg{position:absolute;inset:0;border-bottom:1px solid var(--tl-graticule)}
.lane:hover .lbg{background:var(--tl-hover)}
.lane .llab{position:absolute;left:9px;top:2px;font-size:9.5px;font-family:var(--mono);color:var(--tl-ink-3);
  letter-spacing:.03em;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--tl-canvas-bg) 76%,transparent);
  padding-right:16px;opacity:.9;white-space:nowrap}
.lane.merged .llab{color:var(--tl-ink-2)}
.marks{position:absolute;inset:0;overflow:hidden}
.mk{position:absolute;top:14px;will-change:transform}
.mk.dot{width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--c);top:13px}
.mk.dot.i1{width:9px;height:9px;margin-left:-4.5px;top:12px;box-shadow:0 0 0 2px var(--tl-canvas-bg)}
.mk.sp{height:9px;top:12px;background:var(--c);border-radius:2px;opacity:.82}
.mk.sp.life{height:5px;top:14px;border-radius:3px;opacity:.6}
.mk .lb{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);font-size:10.5px;
  color:var(--tl-ink-2);white-space:nowrap;pointer-events:none;letter-spacing:-.01em}
.mk.sp .lb{left:5px;transform:translateY(-50%);color:var(--tl-ink);mix-blend-mode:normal}
.mk .lb.hide{display:none}
.mk:hover{z-index:9}
.mk:hover .lb{color:var(--tl-ink);font-weight:600}
#empty{position:absolute;inset:24px 0 0 0;display:grid;place-items:center;color:var(--tl-ink-3);font-size:13px;pointer-events:none}
#hud{position:absolute;right:10px;bottom:9px;font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);
  background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:5px;padding:3px 7px;z-index:4}
#tip{position:fixed;z-index:960;background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:6px;
  box-shadow:var(--tl-shadow-pop);padding:5px 8px;font-size:11.5px;pointer-events:none;display:none;max-width:290px}
#tip em{font-family:var(--mono);font-style:normal;color:var(--tl-ink-3);font-size:10px}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="phead"><h1>Layers</h1><span class="sub" id="hcount"></span></div>
    <div id="tree"></div>
    <div class="pfoot">
      <button class="btn pri" id="addLane">+ Add lane</button>
      <button class="btn" id="addGroup">+ Group</button>
    </div>
  </aside>
  <main id="stage">
    <div id="axis"></div>
    <div id="grid"></div>
    <div id="scroll"><div id="lanes"></div></div>
    <div id="hud"></div>
  </main>
</div>
<div id="dropline"></div>
<div id="ghost"></div>
<div class="pop" id="setpop"></div>
<div class="pop" id="libpop"></div>
<div id="tip"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
