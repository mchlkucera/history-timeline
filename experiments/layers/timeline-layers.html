<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Layers concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
/* ── tokens (trimmed from design/tokens.css) ─────────────────────────────── */
:root{
  color-scheme:light;
  --tl-ground:#E3E8E6; --tl-canvas-bg:#E7ECEA; --tl-surface:#F5F7F6; --tl-surface-2:#EDF0EF;
  --tl-surface-3:#E4E9E7; --tl-surface-over:rgba(245,247,246,.94);
  --tl-hover:rgba(18,24,26,.045); --tl-press:rgba(18,24,26,.085); --tl-selected:rgba(18,24,26,.07);
  --tl-ink:#12181A; --tl-ink-2:#505E63; --tl-ink-3:#6D7B7F; --tl-ink-on-accent:#fff;
  --tl-rule:#C7D0CD; --tl-rule-soft:#D6DEDB; --tl-rule-strong:#ADB9B6;
  --tl-graticule:rgba(18,24,26,.055); --tl-tick:rgba(18,24,26,.30); --tl-tick-major:rgba(18,24,26,.55);
  --tl-accent:#B4382A; --tl-accent-hover:#8E2C21; --tl-accent-soft:rgba(180,56,42,.12); --tl-accent-line:rgba(180,56,42,.45);
  --tl-cat-power:#2C4E8F; --tl-cat-war:#8B4A31; --tl-cat-belief:#6B3F79; --tl-cat-sci:#1F6E63;
  --tl-cat-art:#A33A63; --tl-cat-nature:#4F6B2B; --tl-cat-society:#8A6B15; --tl-cat-reach:#16657E;
  --tl-shadow-pop:0 8px 24px rgba(18,24,26,.16),0 1px 2px rgba(18,24,26,.10);
  --tl-shadow-drag:0 10px 26px rgba(18,24,26,.22);
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --tl-ground:#14191B; --tl-canvas-bg:#171D1F; --tl-surface:#1B2225; --tl-surface-2:#20282B;
  --tl-surface-3:#262F33; --tl-surface-over:rgba(27,34,37,.94);
  --tl-hover:rgba(233,240,238,.055); --tl-press:rgba(233,240,238,.10); --tl-selected:rgba(233,240,238,.08);
  --tl-ink:#E9F0EE; --tl-ink-2:#A9B7B9; --tl-ink-3:#7E8D90;
  --tl-rule:#2E393C; --tl-rule-soft:#283134; --tl-rule-strong:#41504F;
  --tl-graticule:rgba(233,240,238,.06); --tl-tick:rgba(233,240,238,.28); --tl-tick-major:rgba(233,240,238,.5);
  --tl-accent:#E06B58; --tl-accent-hover:#F08974; --tl-accent-soft:rgba(224,107,88,.16); --tl-accent-line:rgba(224,107,88,.5);
  --tl-cat-power:#7098DC; --tl-cat-war:#C98058; --tl-cat-belief:#B287C0; --tl-cat-sci:#45B39D;
  --tl-cat-art:#E0789F; --tl-cat-nature:#92B85C; --tl-cat-society:#D2A63C; --tl-cat-reach:#4FAFC9;
  --tl-shadow-pop:0 8px 24px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --tl-shadow-drag:0 10px 26px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--tl-ground);color:var(--tl-ink);
  font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:288px 1fr;height:100vh}

/* ── PANEL ───────────────────────────────────────────────────────────────── */
#panel{background:var(--tl-surface);border-right:1px solid var(--tl-rule);
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:5}
.phead{padding:11px 12px 9px;border-bottom:1px solid var(--tl-rule-soft);display:flex;align-items:baseline;gap:7px}
.phead h1{font-size:12px;font-weight:600;letter-spacing:.02em}
.phead .sub{font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);letter-spacing:.04em;text-transform:uppercase}
#tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:5px 0 10px;scrollbar-width:thin}
.pfoot{border-top:1px solid var(--tl-rule-soft);padding:7px 8px;display:flex;gap:6px}
.btn{font:inherit;font-size:11.5px;color:var(--tl-ink-2);background:transparent;border:1px solid var(--tl-rule);
  border-radius:5px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn:hover{background:var(--tl-hover);color:var(--tl-ink);border-color:var(--tl-rule-strong)}
.btn.pri{border-color:var(--tl-rule-strong)}

.group{margin:1px 0 3px}
.ghead{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 5px;cursor:default;position:relative}
.ghead:hover{background:var(--tl-hover)}
.ghead .chev{width:13px;height:13px;flex:none;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;transition:transform .13s}
.ghead.col .chev{transform:rotate(-90deg)}
.gname{font-size:11px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--tl-ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;cursor:grab}
.ghead .gcount{font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);opacity:.85}
.kids{margin-left:12px;border-left:1px solid var(--tl-rule-soft);padding-left:1px;position:relative}
.kids.empty{min-height:9px}

.row{display:flex;align-items:center;gap:6px;height:25px;padding:0 6px 0 4px;position:relative;cursor:default}
.row:hover{background:var(--tl-hover)}
.row.sel{background:var(--tl-selected);box-shadow:inset 2px 0 0 var(--tl-accent)}
.row.off .nm,.row.off .dot,.ghead.off .gname{opacity:.34}
.row.ghosted{opacity:.30}
.row.drop-src{opacity:.42;background:var(--tl-accent-soft);box-shadow:inset 0 0 0 1px var(--tl-accent-line);border-radius:3px}
.ghead.drop-src{opacity:.55;background:var(--tl-accent-soft)}
.eye{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;border-radius:3px}
.eye:hover{background:var(--tl-press);color:var(--tl-ink)}
.eye svg{width:12px;height:12px;display:block}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.nm{flex:1;font-size:12.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;letter-spacing:-.005em}
.nm b{font-weight:500}
.cnt{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3);opacity:0;flex:none}
.row:hover .cnt{opacity:.7}

/* detail stepper */
.det{display:flex;align-items:flex-end;gap:1.5px;height:12px;flex:none;cursor:pointer;padding:0 1px}
.det i{width:2.5px;background:var(--tl-rule-strong);border-radius:.5px;display:block;transition:background .1s,height .1s}
.det i:nth-child(1){height:4px}.det i:nth-child(2){height:6px}.det i:nth-child(3){height:8px}
.det i:nth-child(4){height:10px}.det i:nth-child(5){height:12px}
.det i.on{background:var(--tl-ink-2)}
.det:hover i.on{background:var(--tl-accent)}
.row.off .det i.on{background:var(--tl-rule-strong)}
.act{display:flex;gap:1px;flex:none;opacity:0;transition:opacity .1s}
.row:hover .act,.ghead:hover .act{opacity:1}
.ic{width:16px;height:16px;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;border-radius:3px;font-size:12px;line-height:1}
.ic:hover{background:var(--tl-press);color:var(--tl-ink)}
.ic.del:hover{color:var(--tl-accent)}
.grip{width:11px;height:16px;flex:none;display:grid;place-items:center;color:var(--tl-rule-strong);cursor:grab;opacity:0}
.row:hover .grip,.ghead:hover .grip{opacity:1}
.grip svg{width:9px;height:11px}

#dropline{position:fixed;height:2px;background:var(--tl-accent);border-radius:2px;pointer-events:none;
  z-index:900;display:none;box-shadow:0 0 0 1px var(--tl-surface)}
#ghost{position:fixed;pointer-events:none;z-index:901;display:none;background:var(--tl-surface);
  border:1px solid var(--tl-rule-strong);border-radius:5px;box-shadow:var(--tl-shadow-drag);
  padding:4px 9px;font-size:12.5px;display:none;align-items:center;gap:6px;opacity:.97}

/* ── popovers ────────────────────────────────────────────────────────────── */
.pop{position:fixed;z-index:950;background:var(--tl-surface-over);backdrop-filter:blur(10px);
  border:1px solid var(--tl-rule);border-radius:8px;box-shadow:var(--tl-shadow-pop);padding:9px;display:none;min-width:206px}
.pop h4{font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;
  color:var(--tl-ink-3);margin-bottom:7px}
.sw{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.sw b{width:15px;height:15px;border-radius:50%;cursor:pointer;display:block;box-shadow:0 0 0 1px var(--tl-rule)}
.sw b.on{box-shadow:0 0 0 2px var(--tl-surface),0 0 0 3.5px var(--tl-ink-2)}
.pop label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--tl-ink-2);margin-bottom:6px}
.pop input[type=range]{width:104px;accent-color:var(--tl-accent)}
.pop .sep{height:1px;background:var(--tl-rule-soft);margin:7px -9px}
.pop .item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.5px}
.pop .item:hover{background:var(--tl-hover)}
.pop .item .n{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3);margin-left:auto}
#libpop{max-height:60vh;overflow:auto;min-width:236px}
#libpop .empty{font-size:11.5px;color:var(--tl-ink-3);padding:6px}
.dang{color:var(--tl-accent)}

/* ── WORKSPACE ───────────────────────────────────────────────────────────── */
#stage{position:relative;overflow:hidden;background:var(--tl-canvas-bg);cursor:grab}
#stage.pan{cursor:grabbing}
#axis{position:absolute;inset:0 0 auto 0;height:24px;background:var(--tl-surface);
  border-bottom:1px solid var(--tl-rule);z-index:3;overflow:hidden}
#axis .t{position:absolute;top:0;height:24px;font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);
  padding-left:4px;line-height:24px;border-left:1px solid var(--tl-rule-soft);white-space:nowrap}
#grid{position:absolute;inset:24px 0 0 0;pointer-events:none;z-index:0;overflow:hidden}
#grid .g{position:absolute;top:0;bottom:0;width:1px;background:var(--tl-graticule)}
#scroll{position:absolute;inset:24px 0 0 0;overflow-y:auto;overflow-x:hidden;z-index:1}
#lanes{position:relative}
.glab{position:absolute;left:0;right:0;height:19px;display:flex;align-items:center;gap:7px;padding-left:10px;
  transition:transform .16s cubic-bezier(.3,.8,.4,1),opacity .16s;will-change:transform}
.glab s{flex:1;height:1px;background:var(--tl-rule);text-decoration:none;display:block;margin-right:10px}
.glab span{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--tl-ink-3)}
.lane{position:absolute;left:0;right:0;height:30px;
  transition:transform .16s cubic-bezier(.3,.8,.4,1),opacity .16s,height .16s;will-change:transform}
.lane.merged{height:36px}
.lane.merged .lbg{background:var(--tl-hover);border-top:1px solid var(--tl-rule-soft);border-bottom:1px solid var(--tl-rule-soft)}
.lane.merged .marks::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--tl-rule-strong);opacity:.5}
.lane .lbg{position:absolute;inset:0;border-bottom:1px solid var(--tl-graticule)}
.lane:hover .lbg{background:var(--tl-hover)}
.lane .llab{position:absolute;left:9px;top:2px;font-size:9.5px;font-family:var(--mono);color:var(--tl-ink-3);
  letter-spacing:.03em;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--tl-canvas-bg) 76%,transparent);
  padding-right:16px;opacity:.9;white-space:nowrap}
.lane.merged .llab{color:var(--tl-ink-2)}
.marks{position:absolute;inset:0;overflow:hidden}
.mk{position:absolute;top:14px;will-change:transform}
.mk.dot{width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--c);top:13px}
.mk.dot.i1{width:9px;height:9px;margin-left:-4.5px;top:12px;box-shadow:0 0 0 2px var(--tl-canvas-bg)}
.mk.sp{height:9px;top:12px;background:var(--c);border-radius:2px;opacity:.82}
.mk.sp.life{height:5px;top:14px;border-radius:3px;opacity:.6}
.mk .lb{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);font-size:10.5px;
  color:var(--tl-ink-2);white-space:nowrap;pointer-events:none;letter-spacing:-.01em}
.mk.sp .lb{left:5px;transform:translateY(-50%);color:var(--tl-ink);mix-blend-mode:normal}
.mk .lb.hide{display:none}
.mk:hover{z-index:9}
.mk:hover .lb{color:var(--tl-ink);font-weight:600}
#empty{position:absolute;inset:24px 0 0 0;display:grid;place-items:center;color:var(--tl-ink-3);font-size:13px;pointer-events:none}
#hud{position:absolute;right:10px;bottom:9px;font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);
  background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:5px;padding:3px 7px;z-index:4}
#tip{position:fixed;z-index:960;background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:6px;
  box-shadow:var(--tl-shadow-pop);padding:5px 8px;font-size:11.5px;pointer-events:none;display:none;max-width:290px}
#tip em{font-family:var(--mono);font-style:normal;color:var(--tl-ink-3);font-size:10px}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="phead"><h1>Layers</h1><span class="sub" id="hcount"></span></div>
    <div id="tree"></div>
    <div class="pfoot">
      <button class="btn pri" id="addLane">+ Add lane</button>
      <button class="btn" id="addGroup">+ Group</button>
    </div>
  </aside>
  <main id="stage">
    <div id="axis"></div>
    <div id="grid"></div>
    <div id="scroll"><div id="lanes"></div></div>
    <div id="hud"></div>
  </main>
</div>
<div id="dropline"></div>
<div id="ghost"></div>
<div class="pop" id="setpop"></div>
<div class="pop" id="libpop"></div>
<div id="tip"></div>

  L[id] = {id, tk:k, name:t.name, cat:t.cat, color:t.cat, items:t.items, detail:3, hidden:false, opacity:1};
  return id;
}
let tree = [
  {id:nid('G'), name:'Europe',       collapsed:false, hidden:false, kids:['eu-ess','eu-sci','eu-war','eu-art'].map(k=>mkLayer(k))},
  {id:nid('G'), name:'Asia',         collapsed:false, hidden:false, kids:['as-ess','as-dyn'].map(k=>mkLayer(k))},
  {id:nid('G'), name:'World',        collapsed:false, hidden:false, kids:['deep'].map(k=>mkLayer(k))},
  {id:nid('G'), name:'My interests', collapsed:false, hidden:false, kids:['arts','design','mozart'].map(k=>mkLayer(k))},
];
let libAvail = Object.keys(D.library);     // topics still on the shelf
let soloGroup = null, sel = null;

const G = id => tree.find(g=>g.id===id);
const findLayer = lid => { for(const g of tree){const i=g.kids.indexOf(lid); if(i>=0) return [g,i];} return [null,-1]; };
const groupHidden = g => g.hidden || (soloGroup && soloGroup!==g.id);
const visibleItems = (lay, cap) => lay.items.filter(it=> it.i <= (cap==null?lay.detail:cap));

/* ── ICONS ───────────────────────────────────────────────────────────────── */
const I = {
 eye:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.2 6.5-4.2S14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.9"/></svg>',

/* ── PANEL RENDER ────────────────────────────────────────────────────────── */
const treeEl = $('#tree');
function renderPanel(){
  treeEl.innerHTML = '';
  for(const g of tree){
    const gw = el('div','group'); gw.dataset.gid = g.id;

    const eye  = el('div','eye', groupHidden(g)?I.eyeoff:I.eye); eye.dataset.act='geye'; eye.title='hide group  ·  alt-click = solo';
    const nm   = el('div','gname'); nm.textContent = g.name; nm.dataset.act='gdrag'; nm.title='double-click to rename · drag to move the group';
    const cn   = el('div','gcount'); cn.textContent = g.kids.length;
    const act  = el('div','act');

    const del  = el('div','ic del','×'); del.dataset.act='gdel'; del.title='delete group (its lanes return to the library)';
    act.append(add,del);

    if(!g.collapsed){

        const d = el('div','dot'); d.style.setProperty('--c', cvar(l.color));
        const n = el('div','nm'); n.textContent = l.name; n.dataset.act='drag';
        const c = el('div','cnt'); c.textContent = visibleItems(l).length;
        const det = el('div','det'); det.dataset.act='det'; det.title='detail '+l.detail+'/5 — how much of this layer to show';
        for(let k=1;k<=5;k++){const b=el('i',k<=l.detail?'on':''); b.dataset.lv=k; det.append(b);}
        const act2 = el('div','act');
        const cog = el('div','ic','⚙'); cog.dataset.act='cog'; cog.title='layer settings';
        const x   = el('div','ic del','×'); x.dataset.act='del'; x.title='remove layer (returns to the library)';
        act2.append(cog,x);
        const gr = el('div','grip',I.grip); gr.dataset.act='drag';
        r.append(e,d,n,c,det,act2,gr);

    gw.append(kids); treeEl.append(gw);
  }
  const nl = Object.keys(L).length;
  const nv = tree.reduce((a,g)=>a+(groupHidden(g)?0:g.kids.filter(k=>!L[k].hidden).length),0);

}

/* ── WORKSPACE RENDER ────────────────────────────────────────────────────── */
const lanesEl = $('#lanes');
let laneRecs = [];
const LANE_H = 30, MERGE_H = 36, GLAB_H = 19;

function buildWorkspace(){
  const keep = new Map([...lanesEl.children].map(n=>[n.dataset.lk,n]));
  const used = new Set(); laneRecs = [];
  let y = 6;
  for(const g of tree){
    if(groupHidden(g)) continue;
    const shown = g.kids.filter(k=>!L[k].hidden);
    if(!shown.length) continue;
    const gk = 'g:'+g.id;
    let gl = keep.get(gk);
    if(!gl){ gl = el('div','glab','<span></span><s></s>'); gl.dataset.lk = gk; lanesEl.append(gl); }
    gl.querySelector('span').textContent = g.name + (g.collapsed?' · merged':'');
    gl.style.transform = `translateY(${y}px)`; used.add(gk); y += GLAB_H;

    if(g.collapsed){
      // COLLAPSE = MERGE: the group's layers become one lane at headline detail
      const cap = Math.max(1, Math.min.apply(null, shown.map(k=>L[k].detail)) - 1);
      const items = [];
      for(const k of shown) for(const it of visibleItems(L[k], cap)) items.push(it);
      items.sort((a,b)=>a.s-b.s);
      const lk = 'm:'+g.id;
      let ln = keep.get(lk) || mkLane(lk,'merged');
      used.add(lk);
      ln.querySelector('.llab').textContent = g.name + ' — ' + shown.length + ' layers merged · headlines only';
      fillLane(ln, items, 1);
      ln.style.transform = `translateY(${y}px)`; y += MERGE_H;
      laneRecs.push({el:ln, items});
    } else {
      for(const k of shown){
        const l = L[k], lk = 'l:'+k;
        let ln = keep.get(lk) || mkLane(lk,'');
        used.add(lk);
        ln.querySelector('.llab').textContent = shortName(l.name, g.name);
        const items = visibleItems(l);
        fillLane(ln, items, l.opacity);
        ln.style.transform = `translateY(${y}px)`; y += LANE_H;
        laneRecs.push({el:ln, items});
      }
    }
  }
  for(const [k,n] of keep) if(!used.has(k)) n.remove();
  lanesEl.style.height = (y+14)+'px';
  position();
  $('#hud').textContent = laneRecs.length + ' lanes · ' + laneRecs.reduce((a,r)=>a+r.items.length,0) + ' marks';
}
/* the group separator already says "Europe" — don't repeat it in the lane label */
function shortName(name, gname){
  const p = gname + ' · ';
  return name.startsWith(p) ? name.slice(p.length) : name;
}
function mkLane(lk, extra){
  const ln = el('div','lane '+extra);
  ln.dataset.lk = lk;
  ln.innerHTML = '<div class="lbg"></div><div class="llab"></div><div class="marks"></div>';
  ln.style.opacity = 0; ln.style.transform = 'translateY(0px)';
  lanesEl.append(ln);
  requestAnimationFrame(()=>{ ln.style.opacity = 1; });
  return ln;
}
function fillLane(ln, items, op){
  const m = ln.querySelector('.marks');
  m.innerHTML = '';
  ln.style.opacity = (op==null?1:op);
  const arr = [];
  for(const it of items){
    const isSpan = it.e && it.e !== it.s;
    const d = el('div','mk '+(isSpan?('sp'+(it.k==='life'?' life':'')):('dot i'+it.i)));
    d.style.setProperty('--c', cvar(it.c));
    d.dataset.t = it.t; d.dataset.s = it.s; d.dataset.e = it.e||0; d.dataset.c = it.c; d.dataset.i = it.i;
    const lb = el('div','lb'); lb.textContent = it.t; d.append(lb);
    m.append(d); arr.push({n:d, lb, s:it.s, e:isSpan?it.e:0, sp:isSpan, imp:it.i, lw:0});
  }
  for(const a of arr) a.lw = a.lb.offsetWidth;   // measure once, not every pan frame
  ln._marks = arr;
}

/* ── TIME SCALE — log(years before present), so deep time and 1789 coexist ─ */
const NOW = 2030;
const U = y => Math.log10(Math.max(1, NOW - y));
const uMin = U(2026), uMax = U(-13.8e9);
let view = {u0: U(-12000), k: 300};   // u at x=0 (left edge), px per u-unit
const xOf = y => (view.u0 - U(y)) * view.k;

function position(){
  const W = $('#stage').clientWidth;
  for(const r of laneRecs){
    const arr = r.el._marks || [], n = arr.length;
    let lastR = -1e9;
    for(let i=0;i<n;i++){
      const m = arr[i], x = xOf(m.s);
      const nx = i < n-1 ? xOf(arr[i+1].s) : 1e9;         // where the next mark lands
      if(m.sp){
        const w = Math.max(3, xOf(m.e) - x);
        m.n.style.transform = `translateX(${x}px)`; m.n.style.width = w+'px';
        const room = w > m.lw + 14 && x + w > 0 && x < W && x + 4 >= lastR;
        m.lb.classList.toggle('hide', !room);
        if(room) lastR = x + Math.min(w, m.lw + 14);
      } else {
        m.n.style.transform = `translateX(${x}px)`;
        /* headline marks keep their label even in a crowd; minor ones yield */
        const roomy = nx - x > m.lw + 14 || (m.imp <= 2 && nx - x > 22);
        const on = x > -40 && x < W + 40 && x > lastR + 7 && roomy;
        m.lb.classList.toggle('hide', !on);
        if(on) lastR = x + m.lw + 10;
      }
    }
  }
  drawAxis();
}
const TICKS = [-13e9,-1e9,-100e6,-10e6,-1e6,-100000,-10000,-5000,-3000,-2000,-1000,-500,-200,0,500,1000,1200,1400,1500,1600,1700,1800,1850,1900,1925,1950,1975,2000,2020];
function fmt(y){
  const a = Math.abs(y);
  if(a>=1e9) return (a/1e9).toFixed(a>=1e10?0:1)+' bn'+(y<0?' BCE':'');
  if(a>=1e6) return (a/1e6).toFixed(0)+' m'+(y<0?' BCE':'');
  if(a>=10000) return (a/1000).toFixed(0)+'k'+(y<0?' BCE':'');
  return y<0 ? a+' BCE' : (y===0?'0':''+y);
}
function drawAxis(){
  const W = $('#stage').clientWidth;
  let h='', gh='', last=-1e9;
  for(const t of TICKS){
    const x = xOf(t);
    if(x < -20 || x > W) continue;
    if(x - last < 56) continue;
    last = x;
    h += `<div class="t" style="left:${x}px">${fmt(t)}</div>`;
    gh += `<div class="g" style="left:${x}px"></div>`;
  }
  $('#axis').innerHTML = h; $('#grid').innerHTML = gh;
}

/* ── PAN / ZOOM ──────────────────────────────────────────────────────────── */
const stage = $('#stage');
function clampView(){
  const W = stage.clientWidth;
  view.u0 = Math.max(uMin + 0.05, Math.min(uMax + W/view.k - 0.05, view.u0));
}
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const px = e.clientX - stage.getBoundingClientRect().left;
  if(e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)){
    const uAt = view.u0 - px/view.k;
    view.k = Math.max(26, Math.min(6000, view.k * Math.exp(-e.deltaY * 0.0018)));
    view.u0 = uAt + px/view.k;
  } else view.u0 += e.deltaX / view.k;
  clampView(); position();
},{passive:false});
let panning = null;
stage.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  panning = {x:e.clientX, u0:view.u0}; stage.classList.add('pan');
});
window.addEventListener('mousemove', e=>{
  if(!panning) return;
  view.u0 = panning.u0 + (e.clientX - panning.x)/view.k;   // content follows the hand
  clampView(); position();
});
window.addEventListener('mouseup', ()=>{ panning=null; stage.classList.remove('pan'); });

const tip = $('#tip');
stage.addEventListener('mousemove', e=>{
  const m = e.target.closest && e.target.closest('.mk');
  if(!m || panning){ tip.style.display='none'; return; }
  const s = +m.dataset.s, en = +m.dataset.e;
  tip.innerHTML = `<div>${m.dataset.t}</div><em>${fmt(s)}${en&&en!==s?' – '+fmt(en):''} · ${m.dataset.c} · level ${m.dataset.i}</em>`;
  tip.style.display='block';
  tip.style.left = Math.min(e.clientX+12, innerWidth-300)+'px';
  tip.style.top = (e.clientY+14)+'px';
});
stage.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });

/* ── PANEL INTERACTIONS ──────────────────────────────────────────────────── */
treeEl.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  const row = e.target.closest('.row'), gh = e.target.closest('.ghead');
  const host = row||gh; if(!host) return;
  const gid = host.dataset.gid, lid = row && row.dataset.lid;
  if(act==='collapse'){ G(gid).collapsed = !G(gid).collapsed; renderPanel(); buildWorkspace(); }
  else if(act==='geye'){
    if(e.altKey) soloGroup = (soloGroup===gid)?null:gid;
    else G(gid).hidden = !G(gid).hidden;
    renderPanel(); buildWorkspace();
  }
  else if(act==='gadd'){ openLib(t, gid); }
  else if(act==='gdel'){ delGroup(gid); }
  else if(act==='eye'){ L[lid].hidden = !L[lid].hidden; renderPanel(); buildWorkspace(); }
  else if(act==='del'){ removeLayer(lid); }
  else if(act==='cog'){ openSettings(t, lid); }
  else if(act==='det'){
    const lv = +(e.target.dataset.lv || 0);
    if(lv){ L[lid].detail = lv; sel = lid; renderPanel(); buildWorkspace(); }
  }
});
treeEl.addEventListener('dblclick', e=>{
  const nm = e.target.closest('.gname'); if(!nm) return;
  const gid = e.target.closest('.ghead').dataset.gid;
  nm.contentEditable = 'true'; nm.focus();
  const done = ()=>{ nm.contentEditable='false'; G(gid).name = nm.textContent.trim()||'Group'; renderPanel(); buildWorkspace(); };
  nm.addEventListener('blur', done, {once:true});
  nm.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); nm.blur(); } });
});
treeEl.addEventListener('contextmenu', e=>{
  const row = e.target.closest('.row'); if(!row) return;
  e.preventDefault(); openSettings(row, row.dataset.lid);
});

function removeLayer(lid){
  const [g,i] = findLayer(lid); if(!g) return;
  const k = L[lid].tk;
  if(!libAvail.includes(k)) libAvail.push(k);
  g.kids.splice(i,1); delete L[lid];
  closePops(); renderPanel(); buildWorkspace();
}
function delGroup(gid){
  const g = G(gid); if(!g) return;
  for(const lid of g.kids){ const k = L[lid].tk; if(!libAvail.includes(k)) libAvail.push(k); delete L[lid]; }
  tree = tree.filter(x=>x.id!==gid);
  if(soloGroup===gid) soloGroup = null;
  renderPanel(); buildWorkspace();
}

/* ── ADD: the topic library ──────────────────────────────────────────────── */
const libpop = $('#libpop'), setpop = $('#setpop');
function closePops(){ libpop.style.display='none'; setpop.style.display='none'; }
document.addEventListener('mousedown', e=>{
  if(!e.target.closest('.pop') && !e.target.closest('[data-act="cog"]') &&
     !e.target.closest('[data-act="gadd"]') && !e.target.closest('#addLane')) closePops();
});
function libEntry(k){ return D.library[k] || D.topics[k]; }
function openLib(anchor, gid){
  closePops();
  const g = G(gid) || tree[tree.length-1];
  if(!g){ return; }
  libpop.innerHTML = '';
  libpop.append(el('h4',null,'Add a lane to <b style="color:var(--tl-ink-2)">'+g.name+'</b>'));
  const avail = libAvail.slice().sort((a,b)=> libEntry(a).name.localeCompare(libEntry(b).name));
  if(!avail.length) libpop.append(el('div','empty','Every topic is already on the board.'));
  for(const k of avail){
    const t = libEntry(k);
    const it = el('div','item'); it.dataset.tk = k;
    const d = el('span',null,'');
    d.style.cssText = `width:7px;height:7px;border-radius:50%;flex:none;background:${cvar(t.cat)}`;
    const n = el('span',null); n.textContent = t.name;
    const c = el('span','n'); c.textContent = t.items.length;
    it.append(d,n,c);
    it.onclick = ()=>{
      g.kids.push(mkLayer(k, D.library[k] ? D.library : D.topics));
      libAvail = libAvail.filter(x=>x!==k);
      closePops(); renderPanel(); buildWorkspace();
    };
    libpop.append(it);
  }
  place(libpop, anchor);
}
$('#addLane').onclick = e => openLib(e.currentTarget, tree.length?tree[tree.length-1].id:null);
$('#addGroup').onclick = ()=>{
  tree.push({id:nid('G'), name:'New group', collapsed:false, hidden:false, kids:[]});
  renderPanel(); buildWorkspace(); treeEl.scrollTop = treeEl.scrollHeight;
};

/* ── per-layer settings ──────────────────────────────────────────────────── */
function openSettings(anchor, lid){
  closePops(); const l = L[lid]; if(!l) return;
  setpop.innerHTML = '';
  setpop.append(el('h4',null,l.name));
  const sw = el('div','sw');

function place(pop, anchor){

  pop.style.top  = Math.min(r.bottom + 5, innerHeight - pop.offsetHeight - 10) + 'px';
}

/* ── DRAG: reorder inside a group, and move between groups ───────────────── */
const ghost = $('#ghost'), dropline = $('#dropline');
let drag = null;
treeEl.addEventListener('mousedown', e=>{
  const t = e.target.closest('[data-act="drag"],[data-act="gdrag"]');
  if(!t || e.button!==0) return;
  const isG = t.dataset.act === 'gdrag';
  const host = e.target.closest(isG ? '.ghead' : '.row');
  if(host.isContentEditable || e.target.isContentEditable) return;
  e.preventDefault();
  drag = {isG, gid:host.dataset.gid, lid:host.dataset.lid, x:e.clientX, y:e.clientY, live:false, el:host};
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  if(!drag.live){
    if(Math.abs(e.clientY-drag.y) + Math.abs(e.clientX-drag.x) < 4) return;
    drag.live = true; closePops();
    ghost.style.display = 'flex';
    if(drag.isG) ghost.innerHTML = '<b style="font-size:11px;letter-spacing:.05em;text-transform:uppercase">'+G(drag.gid).name+'</b>';
    else {
      const l = L[drag.lid];
      ghost.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${cvar(l.color)};display:block"></span>${l.name}`;
    }
    drag.el.classList.add('drop-src');
  }
  ghost.style.left = (e.clientX + 12)+'px';
  ghost.style.top  = (e.clientY - 10)+'px';

  /* LIVE MOVE — the model is reordered as the pointer passes each slot, so the
     workspace lanes slide into their new places while you are still dragging. */
  if(drag.isG){
    const t = groupSlot(e.clientY); if(!t) return;
    const gi = tree.findIndex(g=>g.id===drag.gid);
    let at = t.gi; if(gi < at) at--;
    at = Math.max(0, Math.min(at, tree.length-1));
    if(at !== gi){
      tree.splice(at, 0, tree.splice(gi,1)[0]);
      repaintDuringDrag();
    }
  } else {
    const t = slotAt(e.clientY); if(!t) return;
    const [og,oi] = findLayer(drag.lid);
    const ng = G(t.gid); if(!ng) return;
    let at = t.idx; if(og===ng && oi < at) at--;
    at = Math.max(0, Math.min(at, og===ng ? ng.kids.length-1 : ng.kids.length));
    if(og!==ng || at!==oi){
      og.kids.splice(oi,1);
      ng.kids.splice(at,0,drag.lid);
      repaintDuringDrag();
    }
  }
});
function repaintDuringDrag(){
  renderPanel(); buildWorkspace();
  const sel2 = drag.isG
    ? treeEl.querySelector(`.group[data-gid="${drag.gid}"] .ghead`)
    : treeEl.querySelector(`.row[data-lid="${drag.lid}"]`);
  if(sel2){ sel2.classList.add('drop-src'); drag.el = sel2; }
}
window.addEventListener('mouseup', ()=>{
  if(!drag) return;
  const d = drag; drag = null;
  ghost.style.display='none'; dropline.style.display='none';
  if(!d.live && d.lid){ sel = d.lid; }
  renderPanel(); buildWorkspace();
});
/* nearest insertion point (group, index) to the pointer */
function slotAt(py){
  let best=null, bd=1e9;
  for(const g of tree){
    const gw = treeEl.querySelector(`.group[data-gid="${g.id}"]`); if(!gw) continue;
    const kids = gw.querySelector('.kids');
    const rows = [...kids.querySelectorAll('.row')];
    const kr = kids.getBoundingClientRect();
    const cand = [];
    if(g.collapsed || !rows.length){
      const hr = gw.querySelector('.ghead').getBoundingClientRect();
      cand.push({y:hr.bottom, idx:g.collapsed?g.kids.length:0, x:kr.left+8, w:Math.max(40,kr.width-14)});
    }
    rows.forEach((r,i)=>{
      const b = r.getBoundingClientRect();
      cand.push({y:b.top, idx:i, x:b.left, w:b.width});
      if(i===rows.length-1) cand.push({y:b.bottom, idx:i+1, x:b.left, w:b.width});
    });
    for(const c of cand){
      const dd = Math.abs(py - c.y);
      if(dd < bd){ bd = dd; best = {gid:g.id, idx:c.idx, y:c.y, x:c.x, w:c.w}; }
    }
  }
  return best;
}
function groupSlot(py){
  let best=null, bd=1e9;
  tree.forEach((g,i)=>{
    const gw = treeEl.querySelector(`.group[data-gid="${g.id}"]`); if(!gw) return;
    const b = gw.getBoundingClientRect();
    for(const c of [{y:b.top,gi:i},{y:b.bottom,gi:i+1}]){
      const dd = Math.abs(py - c.y);
      if(dd < bd){ bd = dd; best = {gi:c.gi, y:c.y, x:b.left+2, w:b.width-8}; }
    }
  });
  return best;
}

/* ── boot ────────────────────────────────────────────────────────────────── */
addEventListener('resize', ()=>{ clampView(); position(); });
renderPanel(); buildWorkspace();
window.__tl = {get tree(){return tree;}, L, get view(){return view;}, buildWorkspace, renderPanel,
               get libAvail(){return libAvail;}};
