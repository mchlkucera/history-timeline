<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline — Layers v2 (flat list + canvas)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --tl-ground:#E3E8E6; --tl-canvas-bg:#E7ECEA; --tl-surface:#F5F7F6; --tl-surface-2:#EDF0EF;
  --tl-surface-over:rgba(245,247,246,.96);
  --tl-hover:rgba(18,24,26,.045); --tl-press:rgba(18,24,26,.085); --tl-selected:rgba(18,24,26,.07);
  --tl-ink:#12181A; --tl-ink-2:#505E63; --tl-ink-3:#6D7B7F;
  --tl-rule:#C7D0CD; --tl-rule-soft:#D6DEDB; --tl-rule-strong:#ADB9B6;
  --tl-graticule:rgba(18,24,26,.055);
  --tl-accent:#B4382A; --tl-accent-soft:rgba(180,56,42,.12); --tl-accent-line:rgba(180,56,42,.45);
  --tl-cat-power:#2C4E8F; --tl-cat-war:#8B4A31; --tl-cat-belief:#6B3F79; --tl-cat-sci:#1F6E63;
  --tl-cat-art:#A33A63; --tl-cat-nature:#4F6B2B; --tl-cat-society:#8A6B15; --tl-cat-reach:#16657E;
  --tl-shadow-pop:0 8px 24px rgba(18,24,26,.16);
  --sans:"Instrument Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --tl-ground:#14191B; --tl-canvas-bg:#171D1F; --tl-surface:#1B2225; --tl-surface-2:#20282B;
  --tl-surface-over:rgba(27,34,37,.96);
  --tl-hover:rgba(233,240,238,.055); --tl-press:rgba(233,240,238,.10); --tl-selected:rgba(233,240,238,.08);
  --tl-ink:#E9F0EE; --tl-ink-2:#A9B7B9; --tl-ink-3:#7E8D90;
  --tl-rule:#2E393C; --tl-rule-soft:#283134; --tl-rule-strong:#41504F;
  --tl-graticule:rgba(233,240,238,.06);
  --tl-accent:#E06B58; --tl-accent-soft:rgba(224,107,88,.16); --tl-accent-line:rgba(224,107,88,.5);
  --tl-cat-power:#7098DC; --tl-cat-war:#C98058; --tl-cat-belief:#B287C0; --tl-cat-sci:#45B39D;
  --tl-cat-art:#E0789F; --tl-cat-nature:#92B85C; --tl-cat-society:#D2A63C; --tl-cat-reach:#4FAFC9;
  --tl-shadow-pop:0 8px 24px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--tl-ground);color:var(--tl-ink);font-size:13px;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:280px 1fr;height:100vh}
#panel{background:var(--tl-surface);border-right:1px solid var(--tl-rule);display:flex;flex-direction:column;min-height:0}
.phead{height:24px;padding:0 12px;border-bottom:1px solid var(--tl-rule);display:flex;gap:7px;align-items:center}
.phead h1{font-size:11.5px;font-weight:600}
.phead .sub{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3);text-transform:uppercase;letter-spacing:.04em}
/* #tree mirrors the canvas content box exactly: same origin (24px), same clip, no scroll of its own */
#tree{flex:1;position:relative;overflow:hidden}
.pfoot{border-top:1px solid var(--tl-rule-soft);padding:7px 8px;display:flex;gap:6px}
.btn{font:inherit;font-size:11.5px;color:var(--tl-ink-2);background:none;border:1px solid var(--tl-rule);border-radius:5px;padding:4px 8px;cursor:pointer}
.btn:hover{background:var(--tl-hover);color:var(--tl-ink)}

.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 5px;overflow:hidden}
.row:hover{background:var(--tl-hover)}
.row.ind{padding-left:18px;box-shadow:inset 11px 0 0 -10px var(--tl-rule-soft)}
.row.off .nm,.row.off .dot{opacity:.34}
.row.dragging{opacity:.45;background:var(--tl-accent-soft);box-shadow:inset 0 0 0 1px var(--tl-accent-line)}
.eye{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--tl-ink-3);cursor:pointer;border-radius:3px}
.eye:hover{background:var(--tl-press);color:var(--tl-ink)}
.eye svg{width:12px;height:12px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.nm{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.lvl{font-size:10.5px;color:var(--tl-ink-3);font-family:var(--mono);letter-spacing:.02em;
     border:1px solid transparent;border-radius:4px;padding:1px 5px;cursor:pointer;opacity:0;flex:none}
.row:hover .lvl{opacity:1}
.lvl:hover,.lvl.open{border-color:var(--tl-rule-strong);background:var(--tl-surface-2);color:var(--tl-ink-2);opacity:1}
.x{width:15px;flex:none;text-align:center;color:var(--tl-ink-3);cursor:pointer;opacity:0;font-size:13px;line-height:1}
.row:hover .x{opacity:1}
.x:hover{color:var(--tl-accent)}

.ghead{position:absolute;left:0;right:0;display:flex;align-items:flex-start;gap:5px;padding:1px 6px 0 3px;overflow:hidden;line-height:15px}
.ghead:hover{background:var(--tl-hover)}
.chev{width:14px;flex:none;text-align:center;color:var(--tl-ink-3);cursor:pointer;font-size:9px}
.gname{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tl-ink-2);flex:1;cursor:grab}
.gcount{font-family:var(--mono);font-size:9px;color:var(--tl-ink-3)}
.ghead .x{opacity:0}.ghead:hover .x{opacity:1}

#ghost{position:fixed;z-index:900;display:none;background:var(--tl-surface);border:1px solid var(--tl-rule-strong);
  border-radius:5px;box-shadow:var(--tl-shadow-pop);padding:4px 9px;font-size:12.5px;pointer-events:none}
.pop{position:fixed;z-index:950;background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:8px;
  box-shadow:var(--tl-shadow-pop);padding:6px;display:none;min-width:250px}
.pop h4{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tl-ink-3);padding:3px 6px 5px}
.opt{display:flex;flex-direction:column;padding:5px 8px;border-radius:5px;cursor:pointer}
.opt:hover{background:var(--tl-hover)}
.opt.on{background:var(--tl-selected);box-shadow:inset 2px 0 0 var(--tl-accent)}
.opt b{font-size:12.5px;font-weight:600}
.opt span{font-size:11px;color:var(--tl-ink-3);line-height:1.35}
.item{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:5px;cursor:pointer;font-size:12.5px}
.item:hover{background:var(--tl-hover)}
.item .n{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--tl-ink-3)}
#libpop{max-height:62vh;overflow:auto}

#stage{position:relative;overflow:hidden;background:var(--tl-canvas-bg);cursor:grab}
#stage.pan{cursor:grabbing}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;right:10px;bottom:8px;font-family:var(--mono);font-size:9.5px;color:var(--tl-ink-3);
  background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:5px;padding:3px 7px}
#tip{position:fixed;z-index:960;background:var(--tl-surface-over);border:1px solid var(--tl-rule);border-radius:6px;
  box-shadow:var(--tl-shadow-pop);padding:5px 8px;font-size:11.5px;pointer-events:none;display:none}
#tip em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--tl-ink-3)}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="phead"><h1>Layers</h1><span class="sub" id="hcount"></span></div>
    <div id="tree"></div>
    <div class="pfoot"><button class="btn" id="addLane">+ Add lane</button><button class="btn" id="addGroup">+ Group</button></div>
  </aside>
  <main id="stage"><canvas id="cv"></canvas><div id="hud"></div></main>
</div>
<div id="ghost"></div>
<div class="pop" id="lvlpop"></div>
<div class="pop" id="libpop"></div>
<div id="tip"></div>
<script src="./data.js"></script>
<script>
'use strict';
const D = window.TLDATA;
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const CSS = getComputedStyle(document.documentElement);
const catCol = c => CSS.getPropertyValue('--tl-cat-'+c).trim() || CSS.getPropertyValue('--tl-cat-power').trim();
const tok = n => CSS.getPropertyValue(n).trim();

/* ── DETAIL LEVELS — words, and each word means something concrete ───────── */
const LEVELS = ['low','normal','detailed'];
const LVLTEXT = {
  person:[['low','Just when they lived — the lifespan bar, nothing else.'],
          ['normal','Lifespan plus the landmark moments: birth, death, the works that matter.'],
          ['detailed','Everything — every premiere, every move, the minor business too.']],
  region:[['low','Only the turning points — what a one-page history would name.'],
          ['normal','The turning points plus the events a course would cover.'],
          ['detailed','Everything in the topic, down to the local detail.']],
  movements:[['low','The long dominant movements only — the periods you can name.'],
             ['normal','Every movement, plus the moments that started them.'],
             ['detailed','Everything, including the short-lived and the marginal.']]
};
function filterItems(l){
  const lv = l.level, K = l.kind, sp = it => it.e && it.e !== it.s;
  if(K === 'person'){
    if(lv===0) return l.items.filter(it=> it.life || it.k==='life');
    if(lv===1) return l.items.filter(it=> it.life || it.i<=3);
    return l.items;
  }
  if(K === 'movements'){
    if(lv===0) return l.items.filter(it=> sp(it) && it.i<=3);
    if(lv===1) return l.items.filter(it=> sp(it) ? it.i<=4 : it.i<=2);
    return l.items;
  }
  if(lv===0) return l.items.filter(it=> it.i<=2 || (sp(it) && (it.e-it.s)>=200 && it.i<=3));
  if(lv===1) return l.items.filter(it=> it.i<=3);
  return l.items;
}

/* ── MODEL — a FLAT list; groups are optional nodes in the same list ─────── */
let uid=0; const nid=p=>p+(++uid);
const L={};
function mkLayer(k){
  const t = D.topics[k] || D.library[k];
  const id = nid('L');
  L[id] = {id, tk:k, name:t.name, cat:t.cat, kind:t.kind||'region', items:t.items, level:1, hidden:false};
  return {t:'L', id};
}
/* default state is FLAT — one group exists only to show grouping is available */
let root = [
  mkLayer('eu-ess'), mkLayer('eu-war'), mkLayer('eu-sci'),
  {t:'G', id:nid('G'), name:'Mozart study', collapsed:false, kids:[mkLayer('mozart'), mkLayer('arts')]},
  mkLayer('as-ess'), mkLayer('deep'),
];
let libAvail = Object.keys(D.library).concat(['eu-art','as-dyn','design']);
let dragging = null;

function allNodes(){                       // [{node, parent(list), idx, depth, group}]
  const out=[];
  root.forEach((n,i)=>{
    out.push({n, list:root, i, depth:0});
    if(n.t==='G' && !n.collapsed) n.kids.forEach((k,j)=> out.push({n:k, list:n.kids, i:j, depth:1, g:n}));
  });
  return out;
}
const layers = () => allNodes().filter(x=>x.n.t==='L').map(x=>({...x, l:L[x.n.id]}));

/* ── PANEL ───────────────────────────────────────────────────────────────── */
const EYE='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.2 6.5-4.2S14.5 8 14.5 8 12.1 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.9"/></svg>';
const EYEOFF='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.6 5.4C1.9 6.3 1.5 8 1.5 8S3.9 12.2 8 12.2c1 0 1.9-.2 2.7-.6M6.2 4c.6-.1 1.2-.2 1.8-.2 4.1 0 6.5 4.2 6.5 4.2s-.6 1.1-1.7 2.2"/><path d="M2.5 2.5l11 11"/></svg>';
const treeEl = $('#tree');
function layerRow(id, indent){
  const l = L[id];
  const r = el('div','row'+(indent?' ind':'')+(l.hidden?' off':''));
  r.dataset.lid = id;
  const e = el('div','eye', l.hidden?EYEOFF:EYE); e.dataset.a='eye';
  const d = el('div','dot'); d.style.background = catCol(l.cat);
  const n = el('div','nm'); n.textContent = l.name; n.dataset.a='drag';
  const v = el('div','lvl'); v.textContent = LEVELS[l.level]; v.dataset.a='lvl';
  const x = el('div','x','×'); x.dataset.a='del'; x.title='remove';
  r.append(e,d,n,v,x);
  return r;
}
let panelList=[];
function renderPanel(){
  treeEl.innerHTML=''; panelList=[];
  root.forEach((node,i)=>{
    if(node.t==='L'){
      const r = layerRow(node.id,false); treeEl.append(r);
      panelList.push({el:r, key:'l'+node.id, type:'row', list:root, i});
      return;
    }
    const gh = el('div','ghead'); gh.dataset.gid = node.id;
    const c = el('div','chev', node.collapsed?'▶':'▼'); c.dataset.a='col';
    const nm = el('div','gname'); nm.textContent = node.name; nm.dataset.a='gdrag';
    const ct = el('div','gcount'); ct.textContent = node.kids.length;
    const x = el('div','x','×'); x.dataset.a='gdel'; x.title='ungroup (layers move back to the list)';
    gh.append(c,nm,ct,x); treeEl.append(gh);
    panelList.push({el:gh, key:'g'+node.id, type:'ghead', list:root, i, g:node});
    if(!node.collapsed) node.kids.forEach((k,j)=>{
      const r = layerRow(k.id,true); treeEl.append(r);
      panelList.push({el:r, key:'l'+k.id, type:'row', list:node.kids, i:j, g:node});
    });
  });
  const ls = layers();
  $('#hcount').textContent = ls.filter(x=>!x.l.hidden).length+'/'+ls.length+' shown';
  positionRows();
}
/* THE ALIGNMENT: the canvas layout is the only source of lane geometry, and every
   panel row is positioned and sized from the very same numbers. A lane that packs
   six rows of rectangles gets a six-rows-tall row in the panel, at the same y. */
function positionRows(){
  for(const p of panelList){
    const pl = planByKey[p.key];
    if(!pl){ p.el.style.display='none'; continue; }
    p.el.style.display='flex';
    let h = pl.h;
    if(p.type==='ghead' && p.g.collapsed){ const m = planByKey['m'+p.g.id]; h = GLAB + (m?m.h:0); }
    p.el.style.top = (anim[p.key]==null?pl.y:anim[p.key])+'px';
    p.el.style.height = h+'px';
  }
}
treeEl.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]'); if(!t) return;
  const a = t.dataset.a, row = e.target.closest('.row'), gh = e.target.closest('.ghead');
  const lid = row && row.dataset.lid, gid = gh && gh.dataset.gid;
  if(a==='eye'){ L[lid].hidden = !L[lid].hidden; renderPanel(); layout(); }
  else if(a==='del'){ removeLayer(lid); }
  else if(a==='lvl'){ openLvl(t, lid); }
  else if(a==='col'){ const g=root.find(n=>n.id===gid); g.collapsed=!g.collapsed; renderPanel(); layout(); }
  else if(a==='gdel'){ ungroup(gid); }
});
function removeLayer(lid){
  for(const n of allNodes()) if(n.n.t==='L' && n.n.id===lid){ n.list.splice(n.i,1); break; }
  libAvail.push(L[lid].tk); delete L[lid];
  closePops(); renderPanel(); layout();
}
function ungroup(gid){                      // group disappears, its layers stay in the list
  const i = root.findIndex(n=>n.id===gid);
  const g = root[i]; root.splice(i,1,...g.kids);
  renderPanel(); layout();
}
$('#addGroup').onclick = ()=>{ root.push({t:'G', id:nid('G'), name:'New group', collapsed:false, kids:[]}); renderPanel(); layout(); };

/* ── popovers ────────────────────────────────────────────────────────────── */
const lvlpop=$('#lvlpop'), libpop=$('#libpop');
function closePops(){ lvlpop.style.display='none'; libpop.style.display='none';
  document.querySelectorAll('.lvl.open').forEach(n=>n.classList.remove('open')); }
document.addEventListener('mousedown', e=>{ if(!e.target.closest('.pop') && !e.target.closest('[data-a="lvl"]') && !e.target.closest('#addLane')) closePops(); });
function place(pop, a){ pop.style.display='block'; const r=a.getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth-pop.offsetWidth-10)+'px';
  pop.style.top  = Math.min(r.bottom+4, innerHeight-pop.offsetHeight-10)+'px'; }
function openLvl(anchor, lid){
  closePops(); anchor.classList.add('open');
  const l = L[lid]; lvlpop.innerHTML='';
  lvlpop.append(el('h4',null,'How much of “'+l.name+'”'));
  LVLTEXT[l.kind].forEach(([w,desc],i)=>{
    const o = el('div','opt'+(i===l.level?' on':''));
    o.append(el('b',null,w), el('span',null,desc));
    o.onclick = ()=>{ l.level=i; closePops(); renderPanel(); layout(); };
    lvlpop.append(o);
  });
  place(lvlpop, anchor);
}
$('#addLane').onclick = e=>{
  closePops(); libpop.innerHTML=''; libpop.append(el('h4',null,'Add a lane'));
  if(!libAvail.length) libpop.append(el('div','item','everything is already on the board'));
  for(const k of libAvail.slice().sort()){
    const t = D.library[k]||D.topics[k];
    const it = el('div','item'); const d=el('span'); d.style.cssText='width:7px;height:7px;border-radius:50%;background:'+catCol(t.cat);
    it.append(d, el('span',null,t.name), el('span','n',''+t.items.length));
    it.onclick = ()=>{ root.push(mkLayer(k)); libAvail=libAvail.filter(x=>x!==k); closePops(); renderPanel(); layout(); };
    libpop.append(it);
  }
  place(libpop, e.currentTarget);
};

/* ── DRAG — live move, root ⇄ group, both directions ─────────────────────── */
const ghost=$('#ghost');
treeEl.addEventListener('mousedown', e=>{
  const t = e.target.closest('[data-a="drag"],[data-a="gdrag"]'); if(!t||e.button!==0) return;
  e.preventDefault();
  const isG = t.dataset.a==='gdrag';
  const host = e.target.closest(isG?'.ghead':'.row');
  dragging = {isG, id: isG?host.dataset.gid:host.dataset.lid, x:e.clientX, y:e.clientY, live:false};
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  if(!dragging.live){
    if(Math.abs(e.clientY-dragging.y)+Math.abs(e.clientX-dragging.x) < 4) return;
    dragging.live = true; closePops();
    ghost.style.display='block';
    ghost.textContent = dragging.isG ? root.find(n=>n.id===dragging.id).name : L[dragging.id].name;
  }
  ghost.style.left=(e.clientX+12)+'px'; ghost.style.top=(e.clientY-10)+'px';
  const slot = slotAt(e.clientY); if(!slot) return;
  moveTo(slot);
});
window.addEventListener('mouseup', ()=>{ if(!dragging) return; dragging=null; ghost.style.display='none'; renderPanel(); layout(); });
/* insertion points: (list, index) over root rows and inside every open group */
function slotAt(py){
  const cands=[];
  const push=(list,i,y)=>cands.push({list,i,y});
  for(const p of panelList){
    const b = p.el.getBoundingClientRect();
    if(p.type==='row'){ push(p.list,p.i,b.top); push(p.list,p.i+1,b.bottom); }
    else {
      push(root, p.i, b.top);
      if(p.g.collapsed) push(root, p.i+1, b.bottom);
      else if(!p.g.kids.length) push(p.g.kids, 0, b.bottom);
    }
  }
  if(panelList.length){
    const lb = panelList[panelList.length-1].el.getBoundingClientRect();
    push(root, root.length, lb.bottom);
  }
  let best=null,bd=1e9;
  for(const c of cands){ const d=Math.abs(py-c.y); if(d<bd){bd=d;best=c;} }
  return best;
}
function moveTo(slot){
  const cur = allNodes().find(n=> (n.n.t==='G'? n.n.id : n.n.id) === dragging.id && (dragging.isG ? n.n.t==='G' : n.n.t==='L'));
  if(!cur) return;
  if(dragging.isG && slot.list !== root) return;          // groups don't nest
  let at = slot.i;
  if(cur.list === slot.list){ if(cur.i < at) at--; if(at === cur.i) return; }
  cur.list.splice(cur.i,1);
  slot.list.splice(Math.max(0,Math.min(at,slot.list.length)),0,cur.n);
  renderPanel(); layout();
  const sel = dragging.isG ? treeEl.querySelector(`.ghead[data-gid="${dragging.id}"]`)
                           : treeEl.querySelector(`.row[data-lid="${dragging.id}"]`);
  if(sel) sel.classList.add('dragging');
}

/* ════ WORKSPACE — canvas, like the product ══════════════════════════════ */
const stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
const NOW=2030, U=y=>Math.log10(Math.max(1,NOW-y));
const uMin=U(2026), uMax=U(-13.8e9);
let view={u0:U(-12000), k:300};
const xOf=y=>(view.u0-U(y))*view.k;
const AX=24, ROW=13, DOTROW=15, GAP=6, GLAB=17;
let plan=[], planByKey={}, anim={}, raf=0;

/* interval packing, copied from the product: biggest-first, no visual overlap */
function pack(items){
  const spans = items.filter(it=> it.e && it.e!==it.s)
    .sort((a,b)=> a.i-b.i || (b.e-b.s)-(a.e-a.s) || a.s-b.s);
  const rows=[];
  for(const it of spans){
    let r=0;
    for(; r<rows.length; r++) if(!rows[r].some(o=> it.s < o.e && o.s < it.e)) break;
    if(r===rows.length) rows.push([]);
    rows[r].push(it);
  }
  const dots = items.filter(it=> !(it.e && it.e!==it.s)).sort((a,b)=>a.s-b.s);
  return {rows, dots};
}
function layout(){
  plan=[]; planByKey={}; let y=6;
  for(const node of root){
    if(node.t==='L'){ y = emitLane(node.id, y, null); continue; }
    plan.push({kind:'glab', key:'g'+node.id, text:node.name, y, h:GLAB}); y += GLAB;
    const shown = node.kids.filter(k=>!L[k.id].hidden);
    if(node.collapsed){                       // collapsed = merged digest lane
      if(shown.length){
        const items=[]; for(const k of shown) for(const it of filterItems({...L[k.id], level:0})) items.push(it);
        y = emitItems('m'+node.id, node.name+' — '+shown.length+' layers merged', items, y, true);
      }
    } else for(const k of node.kids) y = emitLane(k.id, y, node.name);
  }
  for(const n of plan){ planByKey[n.key]=n; if(anim[n.key]==null) anim[n.key]=n.y; }
  hud(); positionRows(); paint(); tick();
}
const HIDDEN_H = 22;
function emitLane(lid, y, gname){
  const l=L[lid];
  if(l.hidden){                       // keeps its slot: an empty band, so the row still aligns
    plan.push({kind:'lane', key:'l'+lid, label:l.name, rows:[], dots:[], y, h:HIDDEN_H, hidden:true, n:0});
    return y + HIDDEN_H;
  }
  let name = l.name;
  if(gname && name.startsWith(gname+' · ')) name = name.slice(gname.length+3);
  return emitItems('l'+lid, name, filterItems(l), y, false);
}
function emitItems(key, label, items, y, merged){
  const p = pack(items);
  const h = Math.max(1, p.rows.length)*ROW + (p.dots.length?DOTROW:0) + GAP;
  plan.push({kind:'lane', key, label, rows:p.rows, dots:p.dots, y, h, merged, n:items.length});
  return y + h;
}
function hud(){
  const n = plan.filter(p=>p.kind==='lane' && !p.hidden);
  $('#hud').textContent = n.length+' lanes · '+n.reduce((a,b)=>a+b.n,0)+' marks';
}
/* ease each row toward its target y so a reorder reads as motion */
function tick(){
  if(raf) return;
  raf = requestAnimationFrame(()=>{
    raf=0; let moving=false;
    for(const n of plan){
      const d = n.y - anim[n.key];
      if(Math.abs(d) > .4){ anim[n.key] += d*0.28; moving=true; } else anim[n.key]=n.y;
    }
    positionRows(); paint();
    if(moving) tick();
  });
}
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight, dpr=devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  paint();
}
const TICKS=[-13e9,-1e9,-100e6,-1e6,-100000,-10000,-5000,-3000,-2000,-1000,-500,0,500,1000,1200,1400,1500,1600,1700,1800,1850,1900,1925,1950,1975,2000,2020];
const fmt=y=>{const a=Math.abs(y);
  if(a>=1e9) return (a/1e9).toFixed(a>=1e10?0:1)+' bn'+(y<0?' BCE':'');
  if(a>=1e6) return (a/1e6).toFixed(0)+' m'+(y<0?' BCE':'');
  if(a>=10000) return (a/1000).toFixed(0)+'k'+(y<0?' BCE':'');
  return y<0?a+' BCE':(y===0?'0':''+y); };

function paint(){
  const W=stage.clientWidth, H=stage.clientHeight;
  const bg=tok('--tl-canvas-bg'), ink=tok('--tl-ink'), ink2=tok('--tl-ink-2'), ink3=tok('--tl-ink-3');
  const rule=tok('--tl-rule'), grat=tok('--tl-graticule'), surf=tok('--tl-surface'), hov=tok('--tl-hover');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // grid
  ctx.strokeStyle=grat; ctx.lineWidth=1; ctx.beginPath();
  let last=-1e9; const shown=[];
  for(const t of TICKS){ const x=Math.round(xOf(t))+.5;
    if(x<-20||x>W) continue; if(x-last<58) continue; last=x; shown.push([x,t]);
    ctx.moveTo(x,AX); ctx.lineTo(x,H); }
  ctx.stroke();

  ctx.save(); ctx.translate(0, AX); ctx.beginPath(); ctx.rect(0,0,W,H-AX); ctx.clip();
  for(const n of plan){
    const y = anim[n.key] == null ? n.y : anim[n.key];
    if(n.kind==='glab'){                       // the panel names the group; here it is just a rule
      ctx.strokeStyle=rule; ctx.beginPath();
      ctx.moveTo(0, y+8.5); ctx.lineTo(W, y+8.5); ctx.stroke();
      continue;
    }
    if(n.hidden){                              // an empty band where a hidden layer sits
      ctx.strokeStyle=grat; ctx.setLineDash([3,5]); ctx.beginPath();
      ctx.moveTo(0, y+11.5); ctx.lineTo(W, y+11.5); ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    if(n.merged){ ctx.fillStyle=hov; ctx.fillRect(0,y-2,W,n.h-2); }
    // span rows, stacked one below another
    let ry = y+2;
    for(const row of n.rows){
      for(const it of row){
        const x0=xOf(it.s), x1=xOf(it.e), w=Math.max(2,x1-x0);
        if(x1<0||x0>W) continue;
        const col=catCol(it.c);
        ctx.globalAlpha = it.k==='life' ? .55 : .8;
        ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(x0, ry, w, ROW-3, 2); ctx.fill();
        ctx.globalAlpha=1;
        if(w>44){
          ctx.save(); ctx.beginPath(); ctx.rect(x0,ry,w,ROW-3); ctx.clip();
          ctx.fillStyle='#fff'; ctx.font='10px "Instrument Sans",sans-serif'; ctx.textAlign='left';
          ctx.fillText(it.t, x0+5, ry+ROW-6);
          ctx.restore();
        }
      }
      ry += ROW;
    }
    // one dot row, labels where they fit
    if(n.dots.length){
      const cy = ry + DOTROW/2 - 2;
      ctx.font='10.5px "Instrument Sans",sans-serif'; ctx.textAlign='left';
      let lastR=-1e9;
      for(let i=0;i<n.dots.length;i++){
        const it=n.dots[i], x=xOf(it.s);
        if(x<-30||x>W+30) continue;
        ctx.fillStyle=catCol(it.c);
        ctx.beginPath(); ctx.arc(x, cy, it.i<=2?4:3, 0, 7); ctx.fill();
        const lw = ctx.measureText(it.t).width;
        const nx = i<n.dots.length-1 ? xOf(n.dots[i+1].s) : 1e9;
        if(x>lastR+8 && (nx-x > lw+14 || (it.i<=2 && nx-x>24))){
          ctx.fillStyle=ink2; ctx.fillText(it.t, x+7, cy+3.5);
          lastR = x+lw+10;
        }
      }
      ry += DOTROW;
    }
    // no lane name drawn here — the panel row alongside it is the label
    ctx.strokeStyle=grat; ctx.beginPath(); ctx.moveTo(0, Math.round(y+n.h-3)+.5); ctx.lineTo(W, Math.round(y+n.h-3)+.5); ctx.stroke();
  }
  ctx.restore();

  // axis strip on top
  ctx.fillStyle=surf; ctx.fillRect(0,0,W,AX);
  ctx.strokeStyle=rule; ctx.beginPath(); ctx.moveTo(0,AX-.5); ctx.lineTo(W,AX-.5); ctx.stroke();
  ctx.font='9.5px "IBM Plex Mono",monospace'; ctx.textAlign='left';
  for(const [x,t] of shown){
    ctx.strokeStyle=tok('--tl-rule-soft'); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,AX); ctx.stroke();
    ctx.fillStyle=ink3; ctx.fillText(fmt(t), x+4, 15);
  }
}

/* pan: content follows the hand (same sign as the product) + wheel zoom */
function clampView(){ const W=stage.clientWidth;
  view.u0 = Math.max(uMin+.05, Math.min(uMax + W/view.k - .05, view.u0)); }
let pan=null;
stage.addEventListener('mousedown', e=>{ if(e.button)return; pan={x:e.clientX,u0:view.u0}; stage.classList.add('pan'); });
window.addEventListener('mousemove', e=>{
  if(!pan) return;
  view.u0 = pan.u0 + (e.clientX - pan.x)/view.k;   // drag right → travel back in time, content follows
  clampView(); paint();
});
window.addEventListener('mouseup', ()=>{ pan=null; stage.classList.remove('pan'); });
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const px = e.clientX - stage.getBoundingClientRect().left;
  if(e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)){
    const uAt = view.u0 - px/view.k;
    view.k = Math.max(26, Math.min(6000, view.k*Math.exp(-e.deltaY*0.0018)));
    view.u0 = uAt + px/view.k;
  } else view.u0 += e.deltaX/view.k;
  clampView(); paint();
},{passive:false});

/* crude hit test for a tooltip */
const tip=$('#tip');
stage.addEventListener('mousemove', e=>{
  if(pan){ tip.style.display='none'; return; }
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top-AX;
  let hit=null;
  for(const n of plan){
    if(n.kind!=='lane') continue;
    const y=anim[n.key]??n.y;
    if(my < y || my > y+n.h) continue;
    let ry=y+2;
    for(const row of n.rows){
      if(my>=ry && my<=ry+ROW) for(const it of row){ const x0=xOf(it.s), x1=xOf(it.e);
        if(mx>=x0 && mx<=Math.max(x0+2,x1)) hit=it; }
      ry+=ROW;
    }
    if(!hit && n.dots.length && my>=ry && my<=ry+DOTROW)
      for(const it of n.dots){ if(Math.abs(xOf(it.s)-mx)<5) hit=it; }
  }
  if(!hit){ tip.style.display='none'; return; }
  tip.innerHTML = hit.t+'<br><em>'+fmt(hit.s)+(hit.e&&hit.e!==hit.s?' – '+fmt(hit.e):'')+' · '+hit.c+'</em>';
  tip.style.display='block'; tip.style.left=Math.min(e.clientX+12, innerWidth-260)+'px'; tip.style.top=(e.clientY+14)+'px';
});
stage.addEventListener('mouseleave', ()=>tip.style.display='none');

addEventListener('resize', ()=>{ clampView(); resize(); });
renderPanel(); resize(); layout();
window.__tl2 = {get root(){return root;}, L, layers, get plan(){return plan;}};
</script>
</body>
